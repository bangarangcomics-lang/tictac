<title>Tictac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#F6F2EC; --surface:#FFFFFF; --surface-2:#EFE9E1; --ink:#1F1A17; --ink-2:#51483F; --muted:#857A6E; --line:#E6DED3;
  --accent:#C85F28; --accent-ink:#FFFFFF; --accent-soft:#FBE9DF; --logo:#FC354C;
  --go:#0B8F63; --go-soft:#DCF2E9; --stop:#C93D32; --stop-soft:#FBE4E1; --warn:#A8701A; --warn-soft:#FBF0D9;
  --shadow:0 1px 2px rgba(21,26,45,.06),0 8px 24px -12px rgba(21,26,45,.18);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16120F; --surface:#1F1A16; --surface-2:#29221D; --ink:#F2ECE6; --ink-2:#C9BFB4; --muted:#9A8F84; --line:#372E27;
    --accent:#EE8A55; --accent-ink:#1A0F0A; --accent-soft:#3A2217; --logo:#FC354C;
    --go:#3CCB94; --go-soft:#12342A; --stop:#FF7B6F; --stop-soft:#3B1D1B; --warn:#E8B45A; --warn-soft:#3A2E14;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16120F; --surface:#1F1A16; --surface-2:#29221D; --ink:#F2ECE6; --ink-2:#C9BFB4; --muted:#9A8F84; --line:#372E27;
  --accent:#EE8A55; --accent-ink:#1A0F0A; --accent-soft:#3A2217; --logo:#FC354C;
  --go:#3CCB94; --go-soft:#12342A; --stop:#FF7B6F; --stop-soft:#3B1D1B; --warn:#E8B45A; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:650;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,38px);line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:84px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hint{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.go{background:var(--go-soft);color:var(--go)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.go .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pill.go .dot{animation:none}*{transition:none!important}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--go)}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;color:var(--logo);display:grid;place-items:center;flex:none}
.mark .ast{font-family:"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:900;font-size:100px;line-height:1;transform:translateY(22%);user-select:none}
.mark.lg{width:64px;height:64px}
.brand b{font-family:var(--display);font-size:17px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.2}

/* Home */
.home-hero{display:grid;gap:4px;padding-block:28px 22px}
.clock-big{font-family:var(--mono);font-size:clamp(44px,11vw,76px);font-weight:600;letter-spacing:-.03em;line-height:1}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.person{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--accent);transform:translateY(-1px)}
.person .nm{font-weight:600;font-size:15.5px}
.person .st{font-size:12.5px;color:var(--muted)}
.person .st.on{color:var(--go);font-weight:600}
.home-foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}

/* Employee */
.emp{max-width:560px;margin:0 auto}
.emp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:22px 6px}
.punch-wrap{display:grid;justify-items:center;gap:14px;padding-block:18px 26px}
.punch{position:relative;width:min(250px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 18px 40px -18px var(--accent);transition:transform .12s,background .2s}
.punch:active{transform:scale(.97)}
.punch.is-on{background:var(--ink);color:var(--bg);box-shadow:0 18px 40px -18px var(--ink)}
.punch[disabled]{opacity:.7}
.punch svg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.punch .trk{stroke:var(--surface-2)}
.punch .prg{stroke:var(--go);transition:stroke-dashoffset .6s}
.punch-in{display:grid;gap:4px;justify-items:center}
.punch-label{font-family:var(--display);font-size:clamp(20px,5vw,24px);font-weight:700}
.punch-time{font-family:var(--mono);font-size:14px;opacity:.85}
.punch-status{font-size:15px;color:var(--ink-2);text-align:center}
.punch-status b{font-family:var(--mono);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:600}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.list{display:grid;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:none}
.li .d{min-width:88px;font-weight:600;font-size:14px}
.li .t{font-family:var(--mono);font-size:14px;flex:1;min-width:140px}
.li .h{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14px}

/* Admin */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.tab{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.badge{background:var(--stop);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:4px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.team-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.team-row:first-of-type{border-top:none}
.team-row .meta{display:grid;gap:5px;min-width:0}
.team-row .nm{font-weight:600}
.team-row .hrs{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
.note{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px}
.note:first-of-type{border-top:none}
.note .why{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.note .chg{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:none;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.red td{background:var(--stop-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .x{border:none;background:none;padding:0 0 0 2px;font-size:15px;line-height:1;color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--go)}
.switch input:checked::after{transform:translateX(16px)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{display:block;font-size:14.5px}
.opt span{font-size:13px;color:var(--ink-2)}
.rep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:900px){.rep{grid-template-columns:1fr}}
.stack{display:grid;gap:18px}
.fs{display:grid;gap:10px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,22,.5);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:grid;gap:16px}
.modal.wide{width:min(600px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.pin-dots{display:flex;gap:14px;justify-content:center;padding-block:6px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-dots.bad i{border-color:var(--stop);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;width:100%}
.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:22px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .fn{font-family:var(--body);font-size:14px;background:transparent;border-color:transparent}
.err{color:var(--stop);font-size:13.5px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.setup{max-width:520px;margin:0 auto;padding-block:40px;display:grid;gap:22px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
</style>

<div class="wrap" id="view"><div class="loading">Cargando…</div></div>
<div id="modal"></div>

<script>
/* ---------- utilidades ---------- */
const TOL = 10; // minutos de margen antes de contar horas extra
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DOWL = ['L', 'M', 'X', 'J', 'V', 'S', 'D']; // índice 0 = lunes
const MON = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayLabel = s => { const d = parseYmd(s); return `${DOW[d.getDay()]}, ${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const dayShort = s => { const d = parseYmd(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };
const fmtMin = m => { m = Math.round(m || 0); const neg = m < 0; m = Math.abs(m); return `${neg ? '−' : ''}${Math.floor(m / 60)} h ${pad(m % 60)} min`; };
const fmtHM = m => { m = Math.round(m || 0); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const fmtHours = h => (Math.round(h * 100) / 100).toString().replace('.', ',');
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const COLORS = [['#E6E9FC','#3446D4'],['#DCF2E9','#0B7A55'],['#FBF0D9','#96620F'],['#FBE4E1','#B23A30'],['#EEE3FA','#6B3FB8'],['#DDF0F7','#1B6C8A']];
const colorFor = id => COLORS[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const avatar = (id, name, size = 40) => { const [bg, fg] = colorFor(id); return `<span class="avatar" style="background:${bg};color:${fg};width:${size}px;height:${size}px">${esc(initials(name))}</span>`; };

async function hashPin(pin) {
  const txt = 'reloj-fichaje:' + pin; // no cambiar: invalidaría los PIN guardados
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'f' + (h >>> 0).toString(16);
  }
}

/* ---------- datos ---------- */
const COLS = ['config', 'employees', 'punches', 'notes'];
const S = { config: {}, employees: {}, punches: {}, notes: {} };
const loaded = new Set();
let B = null;
let downloadsCap = null;

async function initBackend() {
  let db = null;
  if (window.claude && typeof claude.use === 'function') {
    try { db = await claude.use('db'); } catch { db = null; }
    claude.use('downloads').then(d => { downloadsCap = d; }).catch(() => {});
  }
  if (db) {
    B = {
      mode: 'db',
      put: async (c, id, d) => { S[c] = { ...S[c], [id]: d }; scheduleRender(); await db.doc(`${c}/${id}`).set(d); },
      del: async (c, id) => { const o = { ...S[c] }; delete o[id]; S[c] = o; scheduleRender(); await db.doc(`${c}/${id}`).delete(); },
    };
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      S[c] = o; loaded.add(c); scheduleRender();
    }, err => { console.warn(c, err); loaded.add(c); scheduleRender(); }));
  } else {
    const saved = LS.get('fichaje.localdb') || {};
    COLS.forEach(c => { S[c] = saved[c] || {}; loaded.add(c); });
    const persist = () => LS.set('fichaje.localdb', S);
    B = {
      mode: 'local',
      put: async (c, id, d) => { S[c] = { ...S[c], [id]: d }; persist(); scheduleRender(); },
      del: async (c, id) => { const o = { ...S[c] }; delete o[id]; S[c] = o; persist(); scheduleRender(); },
    };
    scheduleRender();
  }
}
async function save(c, id, d) {
  try { await B.put(c, id, d); return true; }
  catch (e) { console.error(e); toast('No se ha podido guardar. Comprueba la conexión e inténtalo de nuevo.'); return false; }
}
async function remove(c, id) {
  try { await B.del(c, id); return true; }

const cfg = () => S.config.app || null;
const emps = (all = false) => Object.entries(S.employees).filter(([, e]) => all || e.active !== false).sort((a, b) => a[1].name.localeCompare(b[1].name, 'es'));
function entriesOf(empId) {
  const out = [];
  for (const [docId, doc] of Object.entries(S.punches)) if (doc.emp === empId) for (const e of doc.entries || []) out.push({ ...e, docId });
  return out.sort((a, b) => a.in.localeCompare(b.in));
}
const openEntry = empId => entriesOf(empId).find(e => !e.out) || null;
const workedMin = (e, now = new Date()) => Math.max(0, ((e.out ? new Date(e.out) : now) - new Date(e.in)) / 60000);
function dayWorked(empId, dateStr, includeOpen = true) {
  return entriesOf(empId).filter(e => ymd(new Date(e.in)) === dateStr && (includeOpen || e.out)).reduce((a, e) => a + workedMin(e), 0);
}
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const workdays = emp => (emp.days && emp.days.length ? emp.days : [1, 2, 3, 4, 5]);
// Días laborables = días en que PUEDE trabajar. Lo que debe cumplir lo fijan las horas y las jornadas por semana.
const jornadas = emp => Math.max(1, Math.min(7, emp.jornadas || workdays(emp).length));
const jornadaMin = emp => emp.mode === 'day' ? emp.hours * 60 : (emp.hours * 60) / jornadas(emp);
const weeklyHours = emp => emp.mode === 'day' ? emp.hours * jornadas(emp) : emp.hours;
function daysText(emp) {
  const d = workdays(emp).map(x => (x + 6) % 7).sort((a, b) => a - b);
  const contiguous = d.every((v, i) => i === 0 || v === d[i - 1] + 1);
  return contiguous && d.length > 2 ? `${DOWL[d[0]]}–${DOWL[d[d.length - 1]]}` : d.map(i => DOWL[i]).join(' ');
}
function contractText(emp) {
  return emp.mode === 'day'
    ? `${fmtHours(emp.hours)} h/día × ${jornadas(emp)} jornadas (${fmtHours(weeklyHours(emp))} h/sem) · días posibles ${daysText(emp)}`
    : `${fmtHours(emp.hours)} h/semana en ${jornadas(emp)} jornadas · días posibles ${daysText(emp)}`;
}
function weekWorked(empId, ref = new Date()) {
  const ws = weekStart(ref); const we = new Date(ws); we.setDate(we.getDate() + 7);
  return entriesOf(empId).filter(e => { const d = new Date(e.in); return d >= ws && d < we; }).reduce((a, e) => a + workedMin(e), 0);
}

/* ---------- festivos nacionales (España) ---------- */
function easter(y) { const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
function nationalHolidays(y) {
  const list = ['01-01','01-06','05-01','08-15','10-12','11-01','12-06','12-08','12-25'].map(s => `${y}-${s}`);
  const gf = easter(y); gf.setDate(gf.getDate() - 2); list.push(ymd(gf));
  return list;
}

/* ---------- cálculo del informe ---------- */
function computeReport(empId, o) {
  const emp = S.employees[empId];
  const hol = new Set(o.fest ? o.holidays : []);
  const byDay = {}, openDays = new Set();
  for (const e of entriesOf(empId)) {
    const d = ymd(new Date(e.in));
    if (!e.out) { openDays.add(d); continue; }
    (byDay[d] = byDay[d] || []).push(e);
  }
  const days = [];
  for (let d = parseYmd(o.from); d <= parseYmd(o.to); d.setDate(d.getDate() + 1)) {
    const s = ymd(d), dw = d.getDay();
    const ents = byDay[s] || [];
    const isHol = hol.has(s);
    const special = (o.sat && dw === 6) || (o.sun && dw === 0) || isHol;
    const possible = workdays(emp).includes(dw);
    const type = isHol ? 'Festivo' : dw === 6 ? 'Sábado' : dw === 0 ? 'Domingo' : possible ? 'Laborable' : 'No laborable';
    days.push({ date: s, dw, ents, special, isHol, possible, type, expected: 0, worked: ents.reduce((a, e) => a + workedMin(e), 0),
      otL: 0, otF: 0, def: 0, open: openDays.has(s), edits: ents.flatMap(e => (e.edits || []).map(x => ({ ...x }))) });
  }
  const weeks = [];
  for (const day of days) {
    const k = ymd(weekStart(parseYmd(day.date)));
    let w = weeks[weeks.length - 1];
    if (!w || w.key !== k) { w = { key: k, days: [] }; weeks.push(w); }
    w.days.push(day);
  }
  const possN = workdays(emp).length, jm = jornadaMin(emp);
  for (const w of weeks) {
    w.worked = w.days.reduce((a, d) => a + d.worked, 0);
    // jornadas exigidas: proporcional a los días posibles incluidos en el periodo, menos una por festivo en día posible
    const inWeek = w.days.filter(d => d.possible).length;
    const holOff = o.fest && emp.holMode !== 'keep' ?w.days.filter(d => d.possible && d.isHol).length : 0;
    w.reqJ = Math.max(0, jornadas(emp) * inWeek / possN - holOff);
    w.expected = w.reqJ * jm;
    w.otL = 0; w.otF = 0; w.def = 0;
    const workedDays = w.days.filter(d => d.worked > 0);
    w.jornadas = workedDays.length;
    if (emp.mode === 'day') {
      // las jornadas de contrato se cubren primero con días posibles normales; las jornadas de más
      // (preferentemente sábados/domingos/festivos marcados o días no laborables) son extra
      const rank = d => (d.possible && !d.special ? 0 : d.possible ? 1 : 2);
      const ranked = [...workedDays].sort((a, b) => rank(a) - rank(b) || a.date.localeCompare(b.date));
      ranked.forEach((d, i) => {
        d.expected = Math.max(0, Math.min(1, w.reqJ - i)) * jm;
        const x = d.worked - d.expected;
        if (x > TOL) { if (d.special) d.otF = x - TOL; else d.otL = x - TOL; } // solo cuenta lo que pasa del margen
        if (d.expected > d.worked) d.def = d.expected - d.worked;
        w.otL += d.otL; w.otF += d.otF; w.def += d.def;
      });
      w.missing = Math.max(0, w.reqJ - ranked.length) * jm; // jornadas de contrato no trabajadas
      w.def += w.missing;
    } else {
      // contrato semanal: se aceptan TOL minutos de más por cada jornada trabajada en la semana
      const diff = w.worked - w.expected;
      const margin = TOL * Math.max(1, w.jornadas);
      if (diff > margin) {
        const ot = diff - margin; // solo cuenta lo que pasa del margen
        const specialWorked = w.days.filter(d => d.special).reduce((a, d) => a + d.worked, 0);
        w.otF = Math.min(ot, specialWorked); w.otL = ot - w.otF;
        let left = w.otF;
        for (const d of w.days) if (d.special && left > 0) { d.otF = Math.min(d.worked, left); left -= d.otF; }
      } else if (diff < 0) w.def = -diff;
    }
    w.red = w.expected > 0 && w.worked < w.expected;
  }
  const T = { expected: 0, worked: 0, otL: 0, otF: 0, def: 0 };
  for (const w of weeks) { T.expected += w.expected; T.worked += w.worked; T.otL += w.otL; T.otF += w.otF; T.def += w.def; }
  T.ordinary = T.worked - T.otL - T.otF;
  T.redWeeks = weeks.filter(w => w.red).length; T.weeks = weeks.filter(w => w.expected > 0).length;
  if (o.comp) {
    // solo se compensan horas extra laborables: las de festivos se pagan aparte
    const c1 = Math.min(T.def, T.otL);
    T.compensated = c1; T.otLnet = T.otL - c1; T.otFnet = T.otF; T.defNet = T.def - c1;
  }
  return { emp, empId, days, weeks, T };
}

let rq = false, pendingRender = false;

function render() {

  if (a && $('#view').contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]),textarea,select')) { pendingRender = true; return; }

  tick();
}

/* ---------- PIN ---------- */
function pinModal(title, subtitle, check, extra = '') {
  let val = '';
  openModal(`<div class="modal-h"><div><h2>${esc(title)}</h2><p class="hint">${esc(subtitle)}</p></div><button class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="pin-dots" id="pd"><i></i><i></i><i></i><i></i></div>
    <p class="err" id="pinErr" style="text-align:center" hidden>PIN incorrecto</p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button class="fn" data-k="del">Borrar</button></div>${extra}`);
  const upd = () => $$('#pd i').forEach((i, k) => i.classList.toggle('f', k < val.length));
  const press = async k => {
    if (k === 'del') val = val.slice(0, -1); else if (val.length < 4) val += k;
    upd();
    if (val.length === 4) {
      const ok = await check(val);
      if (!ok) { $('#pinErr').hidden = false; const pd = $('#pd'); pd.classList.add('bad'); setTimeout(() => { pd.classList.remove('bad'); val = ''; upd(); }, 400); }
    }
  };
  $('#modal .pad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  UI.keyHandler = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').innerHTML) closeModal();
  else if (UI.keyHandler && $('#modal').innerHTML && !e.target.matches('input,textarea')) UI.keyHandler(e);
});

let punchBusy = false;

    <div class="field"><label for="em-why">Motivo ${asAdmin ? '(opcional)' : '(obligatorio)'}</label><textarea class="input" id="em-why" placeholder="${asAdmin ? 'Ej.: corrección acordada con el empleado' : 'Ej.: olvidé fichar la salida al cerrar la tienda'}"></textarea></div>
    <p class="err" id="em-err" hidden></p>
    <div class="modal-f">${asAdmin && !isNew ? `<button class="btn danger" data-act="delEntry" data-doc="${entry.docId}" data-id="${entry.id}" style="margin-right:auto">Eliminar</button>` : ''}<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="em-save">${isNew ? 'Añadir' : 'Guardar corrección'}</button></div>`);
  $('#em-save').onclick = async () => {
    const err = $('#em-err'); const fail = m => { err.textContent = m; err.hidden = false; };
    const d = isNew ? $('#em-date').value : date, tin = $('#em-in').value, tout = $('#em-out').value, why = $('#em-why').value.trim();
    if (!d) return fail('Elige el día.');
    if (!tin) return fail('Indica la hora de entrada.');
    if (!asAdmin && why.length < 4) return fail('Explica brevemente el motivo de la corrección.');
    const nIn = combine(d, tin); let nOut = null;
    if (tout) { nOut = combine(d, tout); if (nOut <= nIn) nOut.setDate(nOut.getDate() + 1); }
    const now = new Date();
    if (nIn > now || (nOut && nOut > now)) return fail('No se pueden registrar horas en el futuro.');
    if (!nOut && isNew) return fail('Indica la hora de salida.');
    if (nOut && (nOut - nIn) > 20 * 3600e3) return fail('La jornada supera 20 horas. Revisa las horas.');
    const edit = { at: now.toISOString(), by: asAdmin ? 'admin' : 'employee', oldIn: entry ? entry.in : null, oldOut: entry ? entry.out : null, newIn: nIn.toISOString(), newOut: nOut ? nOut.toISOString() : null, reason: why };
    let ok;
    if (isNew) {
      const docId = `${empId}_${nIn.getFullYear()}-${pad(nIn.getMonth() + 1)}`;
      const doc = clone(S.punches[docId] || { emp: empId, month: docId.slice(-7), entries: [] });
      doc.entries.push({ id: uid(), in: edit.newIn, out: edit.newOut, edits: [edit], manual: true });
      ok = await save('punches', docId, doc);
    } else {
      if (edit.newIn === entry.in && edit.newOut === entry.out) return fail('No has cambiado ninguna hora.');
      const doc = clone(S.punches[entry.docId]); const x = doc.entries.find(y => y.id === entry.id);
      x.in = edit.newIn; x.out = edit.newOut; x.edits = [...(x.edits || []), edit];
      ok = await save('punches', entry.docId, doc);
    }
    if (!ok) return;
    if (!asAdmin) await save('notes', uid(), { empId, kind: isNew ? 'add' : 'edit', entryDate: ymd(nIn), ...edit, read: false });
    closeModal(); toast(asAdmin ? 'Fichaje guardado' : 'Corrección guardada. Tu responsable ha recibido un aviso.');
  };
}
function findEntry(docId, id) { const d = S.punches[docId]; const e = d && (d.entries || []).find(x => x.id === id); return e ? { ...e, docId } : null; }

async function loadDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const jit = (base, spread) => base + Math.round((rnd() - .5) * 2 * spread);
  const g = uid() + 'g', p = uid() + 'p';
  await save('employees', g, { name: 'Gabriela Ortiz', afil: '28/1234567/89', mode: 'week', hours: 20, jornadas: 5, days: [1, 2, 3, 4, 5, 6], canEdit: false, active: true, demo: true, pinHash: await hashPin('1111'), createdAt: new Date().toISOString() });
  await save('employees', p, { name: 'Pedro Almagro', afil: '28/7654321/10', mode: 'day', hours: 8, jornadas: 5, holMode: 'keep', days: [1, 2, 3, 4, 5, 6], canEdit: true, active: true, demo: true, pinHash: await hashPin('2222'), createdAt: new Date().toISOString() });
  const docs = {};
  const add = (emp, dateStr, inMin, outMin, extra = {}) => {
    const a = parseYmd(dateStr); a.setMinutes(inMin); const b = parseYmd(dateStr); b.setMinutes(outMin);
    const id = `${emp}_${dateStr.slice(0, 7)}`; (docs[id] = docs[id] || { emp, month: dateStr.slice(0, 7), entries: [] });
    const e = { id: uid(), in: a.toISOString(), out: outMin == null ? null : b.toISOString(), edits: [], ...extra }; docs[id].entries.push(e); return e;
  };
  const today = new Date(); const start = weekStart(today); start.setDate(start.getDate() - 7 * 9);
  let editDone = null;
  for (let d = new Date(start); ymd(d) < ymd(today); d.setDate(d.getDate() + 1)) {
    const s = ymd(d), dw = d.getDay(), wkIdx = Math.floor((d - start) / (7 * 864e5));
    // Gabriela: 20 h/semana repartidas en tardes, algún sábado
    if ([1, 3, 4, 5].includes(dw) && rnd() > .12) add(g, s, jit(16 * 60 + 30, 5), jit(20 * 60 + 32, 6));
    if (dw === 6 && rnd() > .6) add(g, s, jit(10 * 60, 5), jit(14 * 60 + 3, 5));
    // Pedro: 8 h/día L–V en jornada partida
    const isEditDay = !editDone && wkIdx === 7 && dw === 2;
    if (dw >= 1 && dw <= 5 && !(wkIdx === 3 && dw === 5)) {
      if (!isEditDay) add(p, s, jit(10 * 60, 4), jit(14 * 60, 4));
      add(p, s, jit(16 * 60 + 30, 4), dw === 4 && rnd() > .5 ? jit(21 * 60 + 15, 10) : jit(20 * 60 + 32, 5));
    }
    if (dw === 6 && wkIdx % 3 === 1) add(p, s, jit(10 * 60, 5), jit(14 * 60 + 5, 5));
    if (dw === 0 && wkIdx === 6) add(p, s, jit(10 * 60 + 20, 5), jit(15 * 60, 5));
    if (isEditDay) {
      const e = add(p, s, 9 * 60 + 30, 14 * 60);
      const old = new Date(e.in); old.setMinutes(old.getMinutes() + 42);
      const at = new Date(e.out); at.setMinutes(at.getMinutes() + 20);
      e.edits.push({ at: at.toISOString(), by: 'employee', oldIn: old.toISOString(), oldOut: e.out, newIn: e.in, newOut: e.out, reason: 'Llegué a las 9:30 para recibir al proveedor, pero no fiché hasta que terminé la descarga.' });
      editDone = { e, s };
    }
  }
  const t = ymd(today); if (today.getDay() >= 1 && today.getDay() <= 5) { const now = today.getHours() * 60 + today.getMinutes(); if (now > 10 * 60) add(p, t, 9 * 60 + 58, null); }
  for (const [id, doc] of Object.entries(docs)) await save('punches', id, doc);
  if (editDone) await save('notes', uid(), { empId: p, kind: 'edit', entryDate: editDone.s, ...editDone.e.edits[0], read: false, demo: true });
}

  editEntry: t => { const e = findEntry(t.dataset.doc, t.dataset.id); if (e) entryModal({ entry: e, empId: UI.session.id, asAdmin: false }); },
  addEntry: t => entryModal({ entry: null, empId: t.dataset.emp, asAdmin: false }),
  editEntryAdmin: t => { const e = findEntry(t.dataset.doc, t.dataset.id); if (e) entryModal({ entry: e, empId: S.punches[t.dataset.doc].emp, asAdmin: true }); },
  addEntryAdmin: t => entryModal({ entry: null, empId: t.dataset.emp, asAdmin: true }),
  delEntry: t => {
    const f = $('#modal .modal-f');
    f.innerHTML = `<span class="err" style="margin-right:auto">¿Eliminar este fichaje?</span><button class="btn" data-act="close">Cancelar</button><button class="btn danger" id="de2">Eliminar</button>`;
    $('#de2').onclick = async () => { const doc = clone(S.punches[t.dataset.doc]); doc.entries = doc.entries.filter(x => x.id !== t.dataset.id); if (await save('punches', t.dataset.doc, doc)) { closeModal(); toast('Fichaje eliminado'); } };
  },
  tab: t => { UI.tab = t.dataset.tab; render(); window.scrollTo(0, 0); },
  toggleRead: () => { UI.showRead = !UI.showRead; render(); },
  readNote: async t => { const n = clone(S.notes[t.dataset.id]); n.read = true; await save('notes', t.dataset.id, n); },
  empForm: t => empFormModal(t.dataset.id),
  preset: t => { const n = new Date(); let f, l;
    if (t.dataset.p === 'thisMonth') { f = new Date(n.getFullYear(), n.getMonth(), 1); l = n; }
    if (t.dataset.p === 'lastMonth') { f = new Date(n.getFullYear(), n.getMonth() - 1, 1); l = new Date(n.getFullYear(), n.getMonth(), 0); }
    if (t.dataset.p === 'last4') { l = new Date(weekStart(n)); l.setDate(l.getDate() - 1); f = new Date(l); f.setDate(f.getDate() - 27); }
    if (t.dataset.p === 'year') { f = new Date(n.getFullYear(), 0, 1); l = n; }
    R.from = ymd(f); R.to = ymd(l); saveR(); render(); },
  selEmp: t => { const o = reportOpts(); const id = t.dataset.id; R.sel = o.sel.includes(id) ? o.sel.filter(x => x !== id) : [...o.sel, id]; render(); },
  crit: t => { R[t.dataset.k] = !R[t.dataset.k]; saveR(); render(); },
  addHol: () => { const v = $('#r-hol').value; if (!v) { toast('Elige una fecha'); return; } if (!R.holidays.includes(v)) R.holidays.push(v); saveR(); render(); },
  natHol: () => { const y1 = +R.from.slice(0, 4), y2 = +R.to.slice(0, 4); let n = 0;
    for (let y = y1; y <= y2; y++) for (const h of nationalHolidays(y)) if (h >= R.from && h <= R.to && !R.holidays.includes(h)) { R.holidays.push(h); n++; }
    saveR(); render(); toast(n ? `${n} festivo${n > 1 ? 's' : ''} nacional${n > 1 ? 'es' : ''} añadido${n > 1 ? 's' : ''}` : 'No hay festivos nacionales en este periodo'); },
  delHol: t => { R.holidays = R.holidays.filter(h => h !== t.dataset.d); saveR(); render(); },
  export: async t => { t.disabled = true; t.textContent = 'Generando…'; try { await exportExcel(); } catch (e) { console.error(e); toast('No se ha podido generar el informe.'); } render(); },
  saveCompany: async () => { const c = clone(cfg()); c.company = $('#st-co').value.trim() || c.company; c.cif = $('#st-cif').value.trim(); c.center = $('#st-ct').value.trim(); if (await save('config', 'app', c)) toast('Datos guardados'); },
  savePin: async () => { const a = $('#st-pin').value.trim(), b = $('#st-pin2').value.trim(), err = $('#st-err');
    if (!/^\d{4}$/.test(a)) { err.textContent = 'El PIN debe tener 4 cifras.'; err.hidden = false; return; }
    if (a !== b) { err.textContent = 'Los dos PIN no coinciden.'; err.hidden = false; return; }
    const c = clone(cfg()); c.adminPin = await hashPin(a); if (await save('config', 'app', c)) { $('#st-pin').value = ''; $('#st-pin2').value = ''; err.hidden = true; toast('PIN cambiado'); } },
  clearDemo: t => { t.disabled = true; clearDemo(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); return; }
  if (e.target.classList.contains('scrim')) closeModal();
});

/* ---------- modal y aviso ---------- */
function openModal(html, _, wide) {
  $('#modal').innerHTML = `<div class="scrim"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#modal input:not([type=checkbox]),#modal textarea'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modal').innerHTML = ''; UI.keyHandler = null; if (pendingRender) { pendingRender = false; render(); } }
let toastT;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3600);
}

/* ---------- reloj en vivo ---------- */
function tick() {
  const now = new Date();
  $$('[data-live="clock"],[data-live="clock-big"]').forEach(el => { el.textContent = hm(now); });
  const s = UI.session;
  if (s && s.role === 'emp' && S.employees[s.id]) {
    const e = S.employees[s.id], o = openEntry(s.id), today = ymd(now);
    const tw = dayWorked(s.id, today), exp = jornadaMin(e), ww = weekWorked(s.id), wk = weeklyHours(e) * 60;
    const set = (k, v) => { const el = $(`[data-live="${k}"]`); if (el) el.textContent = v; };
    if (o) { const m = workedMin(o); set('session', `${Math.floor(m / 60)} h ${pad(Math.floor(m % 60))} min ${pad(Math.floor((m * 60) % 60))} s`); }
    set('today', fmtHM(tw)); set('week', fmtHM(ww));
    const wb = $('[data-live="weekbar"]'); if (wb) { wb.classList.toggle('ok', ww >= wk); wb.firstElementChild.style.width = `${wk ? Math.min(100, ww / wk * 100) : 0}%`; }
    const ring = $('#ring'); if (ring) { const pct = exp ? Math.min(1, tw / exp) : (tw ? 1 : 0); ring.style.strokeDashoffset = String(653.5 * (1 - pct)); }
  }
}
setInterval(tick, 1000);
setInterval(() => { if (!$('#modal').innerHTML) scheduleRender(); }, 60000);

initBackend();
</script>
